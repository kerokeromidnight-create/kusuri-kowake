name: 薬価データ自動更新

on:
  schedule:
    - cron: '0 0 1 4 *'    # 毎年4月1日 00:00 UTC = JST 9:00（本改定）
    - cron: '0 0 1 10 *'   # 毎年10月1日 00:00 UTC = JST 9:00（随時収載・中間改定）
  workflow_dispatch:         # GitHub の Actions タブから手動実行も可能

jobs:
  update-yakka:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # data/yakka.json をコミット・プッシュするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要なライブラリをインストール
        run: pip install requests beautifulsoup4

      - name: 薬価データを取得・JSON変換
        run: python scripts/fetch_yakka.py

      - name: 更新されたJSONをコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/yakka.json
          git diff --staged --quiet || git commit -m "薬価データ自動更新 $(date '+%Y-%m-%d')"
          git push
